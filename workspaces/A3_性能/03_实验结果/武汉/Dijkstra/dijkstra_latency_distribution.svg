<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc"><title id="title">武汉路网 Dijkstra 查询耗时分布</title><desc id="desc">Python 与 C++ 外层查询耗时分布。细线表示第10至第90百分位，粗线表示四分位距，点为中位数。</desc><rect width="1280" height="780" fill="#FFFFFF"/><style>text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .muted{fill:#64748B}</style><text x="58" y="48" font-size="25" fill="#172033" text-anchor="start" font-weight="650">武汉路网 Dijkstra 查询耗时分布</text><text x="58" y="76" font-size="14" fill="#64748B" text-anchor="start" font-weight="400">固定 100 个查询；每个查询先取 5 轮耗时中位数。两种语言共用对数纵轴。</text><line x1="63" y1="112" x2="63" y2="134" stroke="#64748B" stroke-width="1.4"/><text x="73" y="129" font-size="13" fill="#273449" text-anchor="start" font-weight="400">P10–P90</text><line x1="178" y1="123" x2="178" y2="139" stroke="#64748B" stroke-width="5"/><text x="190" y="129" font-size="13" fill="#273449" text-anchor="start" font-weight="400">Q1–Q3</text><circle cx="276" cy="131" r="4.5" fill="#273449" stroke="none" stroke-width="0"/><text x="288" y="136" font-size="13" fill="#273449" text-anchor="start" font-weight="400">中位数</text><text x="332" y="174" font-size="17" fill="#172033" text-anchor="middle" font-weight="600">Python</text><text x="332" y="194" font-size="12" fill="#64748B" text-anchor="middle" font-weight="400">耗时 (ms)</text><line x1="106" y1="610.86" x2="560" y2="610.86" stroke="#E8EDF3" stroke-width="1"/><text x="95" y="614.86" font-size="12" fill="#64748B" text-anchor="end" font-weight="400">0.1</text><line x1="106" y1="494.14" x2="560" y2="494.14" stroke="#E8EDF3" stroke-width="1"/><text x="95" y="498.14" font-size="12" fill="#64748B" text-anchor="end" font-weight="400">1</text><line x1="106" y1="377.42" x2="560" y2="377.42" stroke="#E8EDF3" stroke-width="1"/><text x="95" y="381.42" font-size="12" fill="#64748B" text-anchor="end" font-weight="400">10</text><line x1="106" y1="260.69" x2="560" y2="260.69" stro