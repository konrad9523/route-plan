<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img" aria-labelledby="title desc"><title id="title">武汉路网 Dijkstra 逐层配对耗时变化</title><desc id="desc">Python 与 C++ 各算法层相对于上一层的配对耗时减少率。虚线为零参考线，点为中位数，横线为四分位距。</desc><rect width="1280" height="750" fill="#FFFFFF"/><style>text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .muted{fill:#64748B}</style><text x="58" y="48" font-size="25" fill="#172033" text-anchor="start" font-weight="650">武汉路网 Dijkstra 逐层配对耗时变化</text><text x="58" y="76" font-size="14" fill="#64748B" text-anchor="start" font-weight="400">先在同一查询内比较候选层与基准层，再汇总 100 个查询；正值表示候选层更快。</text><line x1="63" y1="116" x2="109" y2="116" stroke="#64748B" stroke-width="2.4"/><circle cx="86" cy="116" r="4.5" fill="#273449" stroke="none" stroke-width="0"/><text x="121" y="121" font-size="13" fill="#273449" text-anchor="start" font-weight="400">点：中位数；线段：Q1–Q3（描述性区间，非置信区间）</text><text x="355" y="164" font-size="17" fill="#172033" text-anchor="middle" font-weight="600">Python</text><line x1="188" y1="180" x2="188" y2="625" stroke="#EDF1F5" stroke-width="1"/><text x="188" y="648" font-size="12" fill="#64748B" text-anchor="middle" font-weight="400">-60%</text><line x1="278" y1="180" x2="278" y2="625" stroke="#EDF1F5" stroke-width="1"/><text x="278" y="648" font-size="12" fill="#64748B" text-anchor="middle" font-weight="400">-30%</text><line x1="368" y1="180" x2="368" y2="625" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4"/><text x="368" y="648" font-size="12" fill="#64748B" text-anchor="middle" font-weight="400">0%</text><line x1="458" y1="180" x2="458" y2="625" stroke="#EDF1F5" stroke-width="1"/><text x="458" y="648" font-size="12" fill="#64748B" text-anchor="middle" font-weight="400">30%</text><line x1="548" y1="180" x2="548" y2="625" stroke="#EDF1F5" stroke-width="1"/><text x="548" y="648" font-size="12" fill="#64748B" text-anchor="middle" font-weight="400">60%</text><text x="144" y="203" font-size="12" fill="#273449" text-anchor="end" font-weight="400">L1 vs L0</text><line x1="384.3" y1="198" x2="406.48" y2="198" stroke="#2563A6" stroke-width="3"/><circle cx="394.25" cy="198" r="5.5" fill="#2563A6" stroke="#FFFFFF" stroke-width="1.5"/><text x="403.25" y="189" font-size="11" fill="#2563A6" text-anchor="start" font-weight="600">+8.8%</text><text x="144" y="282" font-size="12" fill="#273449" text-anchor="end" font-weight="400">L2 vs L1</text><line x1="350.98" y1="277" x2="395.7" y2="277" stroke="#2563A6" stroke-width="3"/><circle cx="385.28" cy="277" r="5.5" fill="#2563A6" stroke="#FFFFFF" stroke-width="1.5"/><text x="394.28" y="268" font-size="11" fill="#2563A6" text-anchor="start" font-weight="600">+5.8%</text><text x="144" y="361" font-size="12" fill="#273449" text-anchor="end" font-weight="400">L3 vs L2</text><line x1="314.01" y1="356" x2="396.49" y2="356" stroke="#2563A6" stroke-width="3"/><circle cx="379.75" cy="356" r="5.5" fill="#2563A6" stroke="#FFFFFF" stroke-width="1.5"/><text x="388.75" y="347" font-size="11" fill="#2563A6" text-anchor="start" font-weight="600">+3.9%</text><text x="144" y="440" font-size="12" fill="#273449" text-anchor="end" font-weight="400">L4 vs L3</text><line x1="191.52" y1="435" x2="242.92" y2="435" stroke="#2563A6" stroke-width="3"/><circle cx="215.44" cy="435" r="5.5" fill="#2563A6" stroke="#FFFFFF" stroke-width="1.5"/><text x="206.44" y="426" font-size="11" fill="#2563A6" text-anchor="end" font-weight="600">-50.9%</text><text x="144" y="519" font-size="12" fill="#273449" text-anchor="end" font-weight="400">B1 vs L0</text><line x1="281.02" y1="514" x2="464.24" y2="514" stroke="#2563A6" stroke-width="3"/><circle cx="387.63" cy="514" r="5.5" fill="#2563A6" stroke="#FFFFFF" stroke-width="1.5"/><text x="396.63" y="505" font-size="11" fill="#2563A6" text-anchor="start" font-weight="600">+6.5%</text><line x1="158" y1="625" x2="578" y2="625" stroke="#94A3B8" stroke-width="1"/><text x="368" y="674" font-size="13" fill="#64748B" text-anchor=